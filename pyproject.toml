[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-switch-optimize"
version = "1.0.0"
description = "多模型降级自修复管理系统：模型故障自修复 + 自动切换"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "mcp>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
mso = "model_switch.cli:main"

[tool.setuptools.packages.find]
include = ["model_switch*"]

[tool.setuptools.package-data]
model_switch = ["rules/*.md"]
